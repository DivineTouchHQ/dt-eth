<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The One in Us — Divine Touch</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --green: #39ff14;
      --black: #000000;
    }

    html,
    body {
      min-height: 100%;
      background: var(--black);
    }

    body {
      color: var(--green);
      font-family: "Courier New", Courier, monospace;
    }

    main {
      width: min(1100px, calc(100% - 40px));
      margin: 0 auto;
      padding: 80px 0 100px;
    }

    .header {
      margin-bottom: 70px;
    }

    h1 {
      color: var(--green);
      font-size: clamp(30px, 5vw, 56px);
      font-weight: 400;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .subtitle {
      color: var(--green);
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.5;
    }

    .ledger-header,
    .piece {
      display: grid;
      grid-template-columns:
        30px
        55px
        minmax(180px, 1.5fr)
        minmax(110px, 0.7fr)
        minmax(180px, 1fr)
        70px;

      column-gap: 12px;
      align-items: center;
    }

    .ledger-header {
      padding: 0 12px 12px;
      border-bottom: 1px solid var(--green);
      color: var(--green);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .piece {
      position: relative;
      min-height: 64px;
      padding: 12px;
      border-bottom: 1px solid #12350c;

      color: var(--green);
      text-decoration: none;
      cursor: pointer;

      transition:
        transform 120ms ease,
        text-shadow 120ms ease,
        border-color 120ms ease;
    }

    .selector,
    .enter {
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .piece:hover {
      transform: translateX(8px);
      border-bottom-color: var(--green);

      text-shadow:
        0 0 5px var(--green),
        0 0 12px rgba(57, 255, 20, 0.55);
    }

    .piece:hover .selector,
    .piece:hover .enter {
      opacity: 1;
    }

    .number,
    .name,
    .price,
    .collector,
    .selector,
    .enter {
      color: var(--green);
    }

    .name {
      font-size: 16px;
      text-transform: uppercase;
    }

    .price {
      white-space: nowrap;
    }

    .collector {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .enter {
      text-align: right;
      font-size: 12px;
    }

    .back {
      display: inline-block;
      margin-top: 50px;
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-shadow:
        0 0 5px var(--green),
        0 0 10px var(--green);
    }

    @media (max-width: 700px) {
      main {
        width: calc(100% - 28px);
        padding: 50px 0 70px;
      }

      .header {
        margin-bottom: 50px;
      }

      .ledger-header {
        display: none;
      }

      .piece {
        grid-template-columns: 18px 32px 1fr auto;

        grid-template-areas:
          "selector number name price"
          ". . collector collector";

        column-gap: 8px;
        row-gap: 8px;
        min-height: 78px;
      }

      .selector {
        grid-area: selector;
      }

      .number {
        grid-area: number;
      }

      .name {
        grid-area: name;
      }

      .price {
        grid-area: price;
        text-align: right;
        font-size: 12px;
      }

      .collector {
        grid-area: collector;
        font-size: 11px;
      }

      .enter {
        display: none;
      }

      .piece:hover {
        transform: translateX(4px);
      }
    }
  </style>
</head>

<body>
